name: run
run-name: release ${{ inputs.target }} ${{ inputs.platform }} ${{ inputs.dispatch_id || inputs.release_id || 'legacy' }}

# Generic build runner. Triggered manually only. Pulls a private source tree,
# builds it (iOS on macOS, Android on Linux), and ships it. No source and no keys
# live in this repo — everything sensitive is an encrypted, repo-scoped Actions secret.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "target"
        required: true
        type: string
      platform:
        description: "platform"
        required: true
        default: ios
        type: choice
        options: [ios, android]
      profile:
        description: "profile"
        required: true
        default: production
        type: string
      submit:
        description: "submit"
        required: true
        default: true
        type: boolean
      wait_for_submission:
        description: "Wait for store delivery (false only for legacy iOS with an independent ASC observer)"
        required: false
        default: true
        type: boolean
      ship_mode:
        description: "ship_mode"
        required: false
        default: eas
        type: choice
        options: [eas, play-replace]
      release_id:
        description: "Frozen source hash ticket (required for runtime-contract apps)"
        required: false
        default: ""
        type: string
      source_commit:
        description: "Optional immutable 40-character source commit; frozen source gate still applies"
        required: false
        default: ""
        type: string
      dispatch_id:
        description: "Unique idempotency ticket for this intentional dispatch"
        required: false
        default: ""
        type: string
      preflight_only:
        description: "Prove workflow-dispatch authority without source checkout, credentials, build, artifact, or submission"
        required: false
        default: false
        type: boolean

concurrency:
  # Intentional dispatches with the same immutable ticket share one queue key,
  # so GitHub serializes exact duplicates before the API list can become
  # eventually consistent. Different evidence-backed tickets may proceed in
  # parallel; legacy dispatches without a ticket retain the historical
  # target/platform queue. The frozen-gate minimum-run check below remains the
  # canonical duplicate guard when a prior run is visible.
  group: >-
    ${{ inputs.dispatch_id != '' &&
      format('run-{0}-{1}-dispatch-{2}', inputs.target, inputs.platform, inputs.dispatch_id) ||
      format('run-{0}-{1}', inputs.target, inputs.platform) }}
  cancel-in-progress: false

# Least privilege: this workflow never needs to write back to this repo.
permissions:
  contents: read
  actions: read

jobs:
  preflight:
    if: ${{ inputs.preflight_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exact no-build dispatch acknowledgement
        env:
          PREFLIGHT_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          set -euo pipefail
          if [[ ! "$PREFLIGHT_DISPATCH_ID" =~ ^readiness-[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid readiness dispatch id"
            exit 1
          fi
          printf 'ORCHESTRATOR_READINESS_ACK {"schemaVersion":1,"dispatchId":"%s","noBuild":true}\n' "$PREFLIGHT_DISPATCH_ID"

  job:
    if: ${{ !inputs.preflight_only }}
    # iOS must build on macOS; Android builds on Linux (faster). Both are free on a public repo.
    # iOS pins macos-26 (Xcode 26.5 default): Apple's iOS-26-SDK upload gate (live 2026-07-11)
    # rejects Xcode-16 binaries, and `eas build --local` uses the RUNNER's Xcode (eas.json image
    # pins don't apply to --local). macos-latest still resolves to macOS 15 / Xcode 16.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      MILESTONE_TARGET: ${{ inputs.target }}
      MILESTONE_PLATFORM: ${{ inputs.platform }}
      MILESTONE_RELEASE_ID: ${{ inputs.release_id }}
      MILESTONE_DISPATCH_ID: ${{ inputs.dispatch_id }}
    steps:
      # Every milestone is JSONL so the log and final job summary can be parsed
      # without exposing source, credentials, or the private binary.
      - name: "Milestone: checkout started"
        run: |
          set -euo pipefail
          MILESTONES="$RUNNER_TEMP/orchestrator-milestones.jsonl"
          EMITTER="$RUNNER_TEMP/orchestrator-emit-milestone.sh"
          : > "$MILESTONES"
          cat > "$EMITTER" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          phase="$1"
          status="$2"
          milestone="$(jq -cn \
            --arg phase "$phase" --arg status "$status" \
            --arg target "$MILESTONE_TARGET" --arg platform "$MILESTONE_PLATFORM" \
            --arg releaseId "$MILESTONE_RELEASE_ID" --arg dispatchId "$MILESTONE_DISPATCH_ID" \
            --arg runId "$GITHUB_RUN_ID" \
            '{schema:"kanac.orchestrator.milestone/v1",phase:$phase,status:$status,target:$target,platform:$platform,releaseId:(if $releaseId == "" then null else $releaseId end),dispatchId:(if $dispatchId == "" then null else $dispatchId end),runId:$runId} | with_entries(select(.value != null))')"
          printf 'ORCHESTRATOR_MILESTONE %s\n' "$milestone"
          printf '%s\n' "$milestone" >> "$ORCHESTRATOR_MILESTONES"
          EOF
          chmod +x "$EMITTER"
          export ORCHESTRATOR_MILESTONES="$MILESTONES"
          "$EMITTER" checkout started
          printf 'ORCHESTRATOR_MILESTONES=%s\nORCHESTRATOR_MILESTONE_EMITTER=%s\n' "$MILESTONES" "$EMITTER" >> "$GITHUB_ENV"

      # Clone only the selected app plus the shared release tooling/config. The fleet's
      # current snapshot is >1 GiB; a full checkout can leave both macOS and Linux
      # runners stuck in pack transfer long before the actual build begins. The PRIVATE
      # source uses a read-only, single-repo token.
      # SOURCE_REPO (owner/name) is itself a secret, so the YAML names nothing.
      - name: Fetch
        env:
          TKN: ${{ secrets.SOURCE_PAT }}
          REPO: ${{ secrets.SOURCE_REPO }}
          TARGET: ${{ inputs.target }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          case "$TARGET" in
            ''|*[!A-Za-z0-9_-]*) echo "invalid target: $TARGET"; exit 1 ;;
          esac
          git clone --depth 1 --filter=blob:none --sparse "https://x-access-token:${TKN}@github.com/${REPO}.git" src
          if [ -n "$SOURCE_COMMIT" ]; then
            if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_commit must be an immutable 40-character lowercase Git SHA"; exit 1
            fi
            git -C src fetch --depth 1 origin "$SOURCE_COMMIT"
            git -C src checkout --detach "$SOURCE_COMMIT"
            test "$(git -C src rev-parse HEAD)" = "$SOURCE_COMMIT"
          fi
          git -C src sparse-checkout set "$TARGET" scripts config
          echo "source_sha=$(git -C src rev-parse HEAD)"

      - name: Scoped checkout gate
        env:
          TARGET: ${{ inputs.target }}
        run: node src/scripts/audit-orchestrator-checkout-scope.mjs "$TARGET"

      - name: "Milestone: checkout complete"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" checkout complete'

      # Future/new apps carry an executable Expo-runtime contract and a web-QA
      # freeze. The release id is the hash of every native build input. Each
      # intentional dispatch has a unique idempotency ticket; rerunning the SAME
      # GitHub run is the retry path for a proven pre-Build infrastructure
      # failure. A later evidence-backed dispatch gets a new ticket instead of
      # being blocked by an arbitrary numeric build cap.
      # Legacy fleet apps without the contract keep their existing release path.
      - name: "Milestone: frozen-gate started"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" frozen-gate started'

      - name: Frozen universal-runtime gate
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET: ${{ inputs.target }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          CONTRACT="src/${TARGET}/store/runtime-contract.json"
          node src/scripts/audit-expo-runtime.mjs "src/${TARGET}" --require-contract
          if [ -f "$CONTRACT" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "runtime-contract app requires release_id from scripts/new-app-release.mjs"
              exit 1
            fi
            if [ -z "$DISPATCH_ID" ]; then
              echo "runtime-contract app requires dispatch_id from scripts/new-app-release.mjs"
              exit 1
            fi
            node src/scripts/new-app-release.mjs verify "$TARGET" --release-id "$RELEASE_ID" --platform "$PLATFORM" --ci
            TITLE="release ${TARGET} ${PLATFORM} ${DISPATCH_ID}"
            : > "$RUNNER_TEMP/release-runs.jsonl"
            for PAGE in $(seq 1 10); do
              PAGE_JSON="$RUNNER_TEMP/release-runs-${PAGE}.json"
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/run.yml/runs?event=workflow_dispatch&per_page=100&page=${PAGE}" > "$PAGE_JSON"
              jq -c '.workflow_runs[]' "$PAGE_JSON" >> "$RUNNER_TEMP/release-runs.jsonl"
              COUNT="$(jq '.workflow_runs | length' "$PAGE_JSON")"
              if [ "$COUNT" -lt 100 ]; then
                break
              fi
            done
            WINNER="$(jq -s --arg title "$TITLE" --argjson current "$GITHUB_RUN_ID" '([.[] | select(.display_title == $title) | .id] + [$current]) | min' "$RUNNER_TEMP/release-runs.jsonl")"
            if [ "$WINNER" -ne "$GITHUB_RUN_ID" ]; then
              echo "dispatch ticket already consumed for ${TARGET}/${PLATFORM}/${DISPATCH_ID}"
              echo "Use the existing run for infrastructure retry; a later intentional dispatch needs a fresh evidence-backed ticket."
              exit 1
            fi
          fi

      - name: "Milestone: frozen-gate complete"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" frozen-gate complete'

      # Runners ship a current Node LTS (+ Xcode/CocoaPods on macOS), so we add NO
      # third-party actions (zero supply-chain surface). eas-cli is the only global install.
      - name: "Milestone: toolchain started"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" toolchain started'

      - name: Toolchain
        run: npm install -g eas-cli

      - name: Install
        working-directory: src/${{ inputs.target }}
        run: npm ci

      - name: "Milestone: toolchain complete"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" toolchain complete'

      # Monetized native builds must agree at three independent boundaries:
      # fail-closed source, a fresh live provider proof, and the selected EAS
      # environment. The source-owned tool prints no SDK key values.
      - name: RevenueCat release gate
        working-directory: src/${{ inputs.target }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: node ../scripts/audit-revenuecat-release.mjs . --platform "${{ inputs.platform }}" --environment "${{ inputs.profile }}" --dispatch-id "$DISPATCH_ID"

      # `eas build --local` creates another local Git clone before compiling. A
      # partial clone cannot serve that operation because its omitted fleet blobs
      # are still promised by the private remote. After every source/provider gate
      # has inspected the real commit, turn the selected sparse worktree into a
      # complete temporary repository containing only this build's files.
      - name: Materialize scoped build repository
        run: |
          mv src/.git "$RUNNER_TEMP/source-git"
          git -C src init
          git -C src config user.name "Syanac release runner"
          git -C src config user.email "release-runner@users.noreply.github.com"
          git -C src add -A
          git -C src commit -m "Materialize scoped source snapshot"

      # Materialize the store key the checked-in eas.json expects (../credentials/…),
      # picking the right one per platform. Only the relevant secret is written.
      - name: Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          GOOGLE_PLAY_SA: ${{ secrets.GOOGLE_PLAY_SA }}
        run: |
          mkdir -p src/credentials
          if [ "${{ inputs.platform }}" = "ios" ]; then
            printf '%s\n' "$ASC_API_KEY_P8" > src/credentials/AuthKey_2D57UQV7B2.p8
          else
            printf '%s'   "$GOOGLE_PLAY_SA" > src/credentials/google-play-service-account.json
          fi

      # Android release builds OOM on the defaults (2 GiB heap / 512 MiB metaspace) during the
      # multi-ABI native compile + Android lint — the daemon dies with OutOfMemoryError: Metaspace
      # and the build hangs. Raise both (the runner has ~16 GB), cap parallel workers to curb peak
      # memory, and disable the daemon (CI never reuses it). GRADLE_USER_HOME (~/.gradle)
      # gradle.properties takes precedence over the one prebuild generates, so this wins.
      - name: Android build memory
        if: ${{ inputs.platform == 'android' }}
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.daemon=false"
          } >> "$HOME/.gradle/gradle.properties"

      # EXPO_ASC_*: lets eas mint/validate iOS credentials (dist cert check +
      # provisioning profile) NON-interactively via the ASC API key — required
      # for a brand-new app's FIRST iOS build (before this, first builds needed
      # a one-off interactive `eas build` on a machine). Key/issuer ids are
      # identifiers, not secrets — useless without the .p8, which stays sealed.
      # No-ops for Android and for apps whose credentials already exist.
      - name: "Milestone: build started"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" build started'

      - name: Build
        working-directory: src/${{ inputs.target }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/src/credentials/AuthKey_2D57UQV7B2.p8
          EXPO_ASC_KEY_ID: 2D57UQV7B2
          EXPO_ASC_ISSUER_ID: a519b1df-17b1-4173-b1dc-f51d0d0aec8d
          EXPO_APPLE_TEAM_ID: 6CJM66G3S2
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --local --non-interactive --output "$RUNNER_TEMP/out.${{ inputs.platform == 'ios' && 'ipa' || 'aab' }}"

      - name: "Milestone: build complete"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" build complete'

      - name: "Milestone: artifact started"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" artifact started'

      # Log the FINAL Android AAB's base-manifest permissions (the artifact Google Play
      # actually validates), plus its sha256 so the submitted binary is provably the one
      # inspected here. The AAB base manifest is protobuf, but permission-name strings are
      # stored as plain UTF-8 bytes, so grep -a finds them without aapt2/bundletool.
      # Log-only (never fails): ad-supported apps legitimately carry AD_ID; this is
      # observability, not a gate. For ad-free apps, "AD_ID present" here explains a
      # subsequent Play "Advertising ID" upload rejection before you go hunting.
      - name: Android manifest permissions
        if: ${{ inputs.platform == 'android' }}
        run: |
          AAB="$RUNNER_TEMP/out.aab"
          echo "sha256: $(sha256sum "$AAB" | cut -d' ' -f1)"
          if grep -q '"react-native-purchases"' "src/${{ inputs.target }}/package.json"; then
            RC_INSPECT="$RUNNER_TEMP/android-revenuecat-inspect"
            rm -rf "$RC_INSPECT"
            mkdir -p "$RC_INSPECT"
            unzip -q "$AAB" -d "$RC_INSPECT"
            if ! grep -RaqE 'goog_[A-Za-z0-9]+' "$RC_INSPECT"; then
              echo "BLOCKED: signed AAB does not contain a RevenueCat Android public key"
              exit 1
            fi
            echo "PASS: signed AAB contains the RevenueCat Android public key marker"
          fi
          echo "=== base manifest permissions ==="
          unzip -p "$AAB" base/manifest/AndroidManifest.xml \
            | grep -aoE '(android|com\.[a-z0-9.]+)\.permission\.[A-Za-z0-9_]+' \
            | sort -u || true
          echo "=== AD_ID gate (informational) ==="
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'com\.google\.android\.gms\.permission\.AD_ID'; then
            echo "PRESENT: com.google.android.gms.permission.AD_ID (OK only if this app declares Advertising ID = Yes)"
          else
            echo "ABSENT: com.google.android.gms.permission.AD_ID"
          fi

      # Match Android's final-artifact observability on iOS. This inspects the signed IPA that
      # would be submitted, without uploading the binary from this public repository. Info.plist,
      # entitlements and bundled locale names are non-secret and let release sessions prove the
      # binary rather than trusting app.config.js or a prebuild directory.
      - name: iOS archive declarations
        if: ${{ inputs.platform == 'ios' }}
        run: |
          IPA="$RUNNER_TEMP/out.ipa"
          INSPECT="$RUNNER_TEMP/ios-inspect"
          echo "sha256: $(shasum -a 256 "$IPA" | awk '{print $1}')"
          rm -rf "$INSPECT"
          mkdir -p "$INSPECT"
          unzip -q "$IPA" -d "$INSPECT"
          APP="$(find "$INSPECT/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          if grep -q '"react-native-purchases"' "src/${{ inputs.target }}/package.json"; then
            if ! grep -RaqE 'appl_[A-Za-z0-9]+' "$APP"; then
              echo "BLOCKED: signed IPA does not contain a RevenueCat iOS public key"
              exit 1
            fi
            echo "PASS: signed IPA contains the RevenueCat iOS public key marker"
          fi
          echo "=== resolved Info.plist ==="
          plutil -p "$APP/Info.plist"
          echo "=== signed entitlements ==="
          codesign -d --entitlements :- "$APP" 2>&1 || true
          echo "=== bundled localizations ==="
          find "$APP" -maxdepth 1 -type d -name '*.lproj' -exec basename {} .lproj \; | sort -u
          echo "=== purpose strings ==="
          for KEY in NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSCameraUsageDescription NSMicrophoneUsageDescription NSLocationWhenInUseUsageDescription NSBluetoothAlwaysUsageDescription; do
            VALUE="$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist" 2>/dev/null || true)"
            if [ -n "$VALUE" ]; then
              echo "$KEY=$VALUE"
            else
              echo "$KEY=ABSENT"
            fi
          done

      - name: "Milestone: artifact complete"
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" artifact complete'

      - name: "Milestone: ship started"
        if: ${{ inputs.submit && (inputs.ship_mode != 'play-replace' || inputs.platform == 'android') }}
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" ship started'

      - name: Ship
        if: ${{ inputs.submit && inputs.ship_mode != 'play-replace' }}
        working-directory: src/${{ inputs.target }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUBMIT_PLATFORM: ${{ inputs.platform }}
          SUBMIT_PROFILE: ${{ inputs.profile }}
          WAIT_FOR_SUBMISSION: ${{ inputs.wait_for_submission }}
        run: |
          set -euo pipefail
          args=(--platform "$SUBMIT_PLATFORM" --profile "$SUBMIT_PROFILE" --non-interactive)
          if [ "$SUBMIT_PLATFORM" = ios ]; then
            args+=(--path "$RUNNER_TEMP/out.ipa")
          else
            args+=(--path "$RUNNER_TEMP/out.aab")
          fi
          case "$WAIT_FOR_SUBMISSION" in
            true) ;;
            false)
              if [ "$SUBMIT_PLATFORM" != ios ] || [ -f store/runtime-contract.json ]; then
                echo "Detached submission requires legacy iOS and an independent ASC observer"
                exit 1
              fi
              args+=(--no-wait)
              ;;
            *) echo "Invalid submission wait policy"; exit 1 ;;
          esac
          eas submit "${args[@]}"
          if [ "$WAIT_FOR_SUBMISSION" = false ]; then
            echo "Submission queued remotely; store delivery and review are NOT yet verified"
          fi

      # Alternate Android ship: upload the AAB and make it the SOLE release on the target
      # track(s) via the androidpublisher API (scripts/play-replace-release.mjs), instead of
      # fastlane supply. Needed to supersede a stuck bundle that fastlane would retain in the
      # release (e.g. a pre-fix AAB carrying AD_ID that blocks every commit). Runs on the
      # runner using the AAB just built + the SA key the Key step wrote to src/credentials.
      - name: Ship (play-replace)
        if: ${{ inputs.submit && inputs.ship_mode == 'play-replace' && inputs.platform == 'android' }}
        working-directory: src/${{ inputs.target }}
        run: node ../scripts/play-replace-release.mjs "$RUNNER_TEMP/out.aab" production,internal

      - name: "Milestone: ship complete"
        if: ${{ inputs.submit && (inputs.ship_mode == 'play-replace' && inputs.platform == 'android' || inputs.ship_mode != 'play-replace' && inputs.wait_for_submission) }}
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" ship complete'

      - name: "Milestone: ship skipped"
        if: ${{ !inputs.submit || (inputs.ship_mode == 'play-replace' && inputs.platform != 'android') }}
        run: '"$ORCHESTRATOR_MILESTONE_EMITTER" ship skipped'

      - name: Milestone summary
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          MILESTONES="$RUNNER_TEMP/orchestrator-milestones.jsonl"
          if [ ! -f "$MILESTONES" ]; then
            : > "$MILESTONES"
          fi
          if [ "$JOB_STATUS" = failure ] || [ "$JOB_STATUS" = cancelled ]; then
            LAST_PHASE="$(tail -n 1 "$MILESTONES" | jq -r '.phase // ""')"
            LAST_STATUS="$(tail -n 1 "$MILESTONES" | jq -r '.status // ""')"
            if { [ "$LAST_PHASE" != ship ] || { [ "$LAST_STATUS" != complete ] && [ "$LAST_STATUS" != skipped ]; }; } \
              && [ -x "$RUNNER_TEMP/orchestrator-emit-milestone.sh" ]; then
              ORCHESTRATOR_MILESTONES="$MILESTONES" "$RUNNER_TEMP/orchestrator-emit-milestone.sh" terminal "$JOB_STATUS"
            fi
          fi
          {
            printf '## Orchestrator milestones\n\n'
            printf '```jsonl\n'
            cat "$MILESTONES"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: deliberately NO artifact upload. On a public repo, artifacts are
      # downloadable by anyone — uploading the binary would leak the build. It goes
      # straight to the store and nowhere else.
