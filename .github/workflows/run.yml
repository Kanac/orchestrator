name: run
run-name: release ${{ inputs.target }} ${{ inputs.platform }} ${{ inputs.release_id || 'legacy' }}

# Generic build runner. Triggered manually only. Pulls a private source tree,
# builds it (iOS on macOS, Android on Linux), and ships it. No source and no keys
# live in this repo — everything sensitive is an encrypted, repo-scoped Actions secret.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "target"
        required: true
        type: string
      platform:
        description: "platform"
        required: true
        default: ios
        type: choice
        options: [ios, android]
      profile:
        description: "profile"
        required: true
        default: production
        type: string
      submit:
        description: "submit"
        required: true
        default: true
        type: boolean
      ship_mode:
        description: "ship_mode"
        required: false
        default: eas
        type: choice
        options: [eas, play-replace]
      release_id:
        description: "Frozen source hash ticket (required for runtime-contract apps)"
        required: false
        default: ""
        type: string

concurrency:
  group: run-${{ inputs.target }}-${{ inputs.platform }}
  cancel-in-progress: false

# Least privilege: this workflow never needs to write back to this repo.
permissions:
  contents: read
  actions: read

jobs:
  job:
    # iOS must build on macOS; Android builds on Linux (faster). Both are free on a public repo.
    # iOS pins macos-26 (Xcode 26.5 default): Apple's iOS-26-SDK upload gate (live 2026-07-11)
    # rejects Xcode-16 binaries, and `eas build --local` uses the RUNNER's Xcode (eas.json image
    # pins don't apply to --local). macos-latest still resolves to macOS 15 / Xcode 16.
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      # Clone the PRIVATE source using a read-only, single-repo token.
      # SOURCE_REPO (owner/name) is itself a secret, so the YAML names nothing.
      - name: Fetch
        env:
          TKN: ${{ secrets.SOURCE_PAT }}
          REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          git clone --depth 1 "https://x-access-token:${TKN}@github.com/${REPO}.git" src
          echo "source_sha=$(git -C src rev-parse HEAD)"

      # Future/new apps carry an executable Expo-runtime contract and a web-QA
      # freeze. The release id is the hash of every native build input. One
      # workflow run per platform may consume it; rerunning the SAME GitHub run
      # is the only retry path for a proven pre-Build infrastructure failure.
      # Legacy fleet apps without the contract keep their existing release path.
      - name: Frozen universal-runtime gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          TARGET: ${{ inputs.target }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          CONTRACT="src/${TARGET}/store/runtime-contract.json"
          node src/scripts/audit-expo-runtime.mjs "src/${TARGET}" --require-contract
          if [ -f "$CONTRACT" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "runtime-contract app requires release_id from scripts/new-app-release.mjs"
              exit 1
            fi
            node src/scripts/new-app-release.mjs verify "$TARGET" --release-id "$RELEASE_ID" --platform "$PLATFORM" --ci
            TITLE="release ${TARGET} ${PLATFORM} ${RELEASE_ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/run.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/release-runs.json"
            WINNER="$(jq --arg title "$TITLE" --argjson current "$GITHUB_RUN_ID" '([.workflow_runs[] | select(.display_title == $title) | .id] + [$current]) | min' "$RUNNER_TEMP/release-runs.json")"
            if [ "$WINNER" -ne "$GITHUB_RUN_ID" ]; then
              echo "one-build budget already consumed for ${TARGET}/${PLATFORM}/${RELEASE_ID}"
              echo "A native harness/selector/timing failure never authorizes another dispatch."
              exit 1
            fi
          fi

      # Runners ship a current Node LTS (+ Xcode/CocoaPods on macOS), so we add NO
      # third-party actions (zero supply-chain surface). eas-cli is the only global install.
      - name: Toolchain
        run: npm install -g eas-cli

      - name: Install
        working-directory: src/${{ inputs.target }}
        run: npm ci

      # Materialize the store key the checked-in eas.json expects (../credentials/…),
      # picking the right one per platform. Only the relevant secret is written.
      - name: Key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          GOOGLE_PLAY_SA: ${{ secrets.GOOGLE_PLAY_SA }}
        run: |
          mkdir -p src/credentials
          if [ "${{ inputs.platform }}" = "ios" ]; then
            printf '%s\n' "$ASC_API_KEY_P8" > src/credentials/AuthKey_2D57UQV7B2.p8
          else
            printf '%s'   "$GOOGLE_PLAY_SA" > src/credentials/google-play-service-account.json
          fi

      # Android release builds OOM on the defaults (2 GiB heap / 512 MiB metaspace) during the
      # multi-ABI native compile + Android lint — the daemon dies with OutOfMemoryError: Metaspace
      # and the build hangs. Raise both (the runner has ~16 GB), cap parallel workers to curb peak
      # memory, and disable the daemon (CI never reuses it). GRADLE_USER_HOME (~/.gradle)
      # gradle.properties takes precedence over the one prebuild generates, so this wins.
      - name: Android build memory
        if: ${{ inputs.platform == 'android' }}
        run: |
          mkdir -p "$HOME/.gradle"
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.daemon=false"
          } >> "$HOME/.gradle/gradle.properties"

      # EXPO_ASC_*: lets eas mint/validate iOS credentials (dist cert check +
      # provisioning profile) NON-interactively via the ASC API key — required
      # for a brand-new app's FIRST iOS build (before this, first builds needed
      # a one-off interactive `eas build` on a machine). Key/issuer ids are
      # identifiers, not secrets — useless without the .p8, which stays sealed.
      # No-ops for Android and for apps whose credentials already exist.
      - name: Build
        working-directory: src/${{ inputs.target }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/src/credentials/AuthKey_2D57UQV7B2.p8
          EXPO_ASC_KEY_ID: 2D57UQV7B2
          EXPO_ASC_ISSUER_ID: a519b1df-17b1-4173-b1dc-f51d0d0aec8d
          EXPO_APPLE_TEAM_ID: 6CJM66G3S2
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --local --non-interactive --output "$RUNNER_TEMP/out.${{ inputs.platform == 'ios' && 'ipa' || 'aab' }}"

      # Log the FINAL Android AAB's base-manifest permissions (the artifact Google Play
      # actually validates), plus its sha256 so the submitted binary is provably the one
      # inspected here. The AAB base manifest is protobuf, but permission-name strings are
      # stored as plain UTF-8 bytes, so grep -a finds them without aapt2/bundletool.
      # Log-only (never fails): ad-supported apps legitimately carry AD_ID; this is
      # observability, not a gate. For ad-free apps, "AD_ID present" here explains a
      # subsequent Play "Advertising ID" upload rejection before you go hunting.
      - name: Android manifest permissions
        if: ${{ inputs.platform == 'android' }}
        run: |
          AAB="$RUNNER_TEMP/out.aab"
          echo "sha256: $(sha256sum "$AAB" | cut -d' ' -f1)"
          echo "=== base manifest permissions ==="
          unzip -p "$AAB" base/manifest/AndroidManifest.xml \
            | grep -aoE '(android|com\.[a-z0-9.]+)\.permission\.[A-Za-z0-9_]+' \
            | sort -u || true
          echo "=== AD_ID gate (informational) ==="
          if unzip -p "$AAB" base/manifest/AndroidManifest.xml | grep -aq 'com\.google\.android\.gms\.permission\.AD_ID'; then
            echo "PRESENT: com.google.android.gms.permission.AD_ID (OK only if this app declares Advertising ID = Yes)"
          else
            echo "ABSENT: com.google.android.gms.permission.AD_ID"
          fi

      # Match Android's final-artifact observability on iOS. This inspects the signed IPA that
      # would be submitted, without uploading the binary from this public repository. Info.plist,
      # entitlements and bundled locale names are non-secret and let release sessions prove the
      # binary rather than trusting app.config.js or a prebuild directory.
      - name: iOS archive declarations
        if: ${{ inputs.platform == 'ios' }}
        run: |
          IPA="$RUNNER_TEMP/out.ipa"
          INSPECT="$RUNNER_TEMP/ios-inspect"
          echo "sha256: $(shasum -a 256 "$IPA" | awk '{print $1}')"
          rm -rf "$INSPECT"
          mkdir -p "$INSPECT"
          unzip -q "$IPA" -d "$INSPECT"
          APP="$(find "$INSPECT/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          echo "=== resolved Info.plist ==="
          plutil -p "$APP/Info.plist"
          echo "=== signed entitlements ==="
          codesign -d --entitlements :- "$APP" 2>&1 || true
          echo "=== bundled localizations ==="
          find "$APP" -maxdepth 1 -type d -name '*.lproj' -exec basename {} .lproj \; | sort -u
          echo "=== purpose strings ==="
          for KEY in NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription NSCameraUsageDescription NSMicrophoneUsageDescription NSLocationWhenInUseUsageDescription NSBluetoothAlwaysUsageDescription; do
            VALUE="$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist" 2>/dev/null || true)"
            if [ -n "$VALUE" ]; then
              echo "$KEY=$VALUE"
            else
              echo "$KEY=ABSENT"
            fi
          done

      - name: Ship
        if: ${{ inputs.submit && inputs.ship_mode != 'play-replace' }}
        working-directory: src/${{ inputs.target }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --path "$RUNNER_TEMP/out.${{ inputs.platform == 'ios' && 'ipa' || 'aab' }}" --non-interactive

      # Alternate Android ship: upload the AAB and make it the SOLE release on the target
      # track(s) via the androidpublisher API (scripts/play-replace-release.mjs), instead of
      # fastlane supply. Needed to supersede a stuck bundle that fastlane would retain in the
      # release (e.g. a pre-fix AAB carrying AD_ID that blocks every commit). Runs on the
      # runner using the AAB just built + the SA key the Key step wrote to src/credentials.
      - name: Ship (play-replace)
        if: ${{ inputs.submit && inputs.ship_mode == 'play-replace' && inputs.platform == 'android' }}
        working-directory: src/${{ inputs.target }}
        run: node ../scripts/play-replace-release.mjs "$RUNNER_TEMP/out.aab" production,internal

      # NOTE: deliberately NO artifact upload. On a public repo, artifacts are
      # downloadable by anyone — uploading the binary would leak the build. It goes
      # straight to the store and nowhere else.
