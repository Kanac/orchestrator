name: native-acceptance
run-name: native-acceptance · ${{ inputs.target }} · ${{ inputs.platform }}

# Generic, non-submitting native runtime gate. It clones the private app fleet,
# builds a simulator/emulator binary, installs it, runs the target app's checked-in
# Maestro flow, prints native runtime evidence, and discards the binary with the
# ephemeral runner. No binary or source artifact is uploaded from this public repo.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "target"
        required: true
        type: string
      platform:
        description: "platform"
        required: true
        default: ios
        type: choice
        options: [ios, android]
      fixture:
        description: "optional target-relative media fixture"
        required: false
        default: ""
        type: string

concurrency:
  group: native-acceptance-${{ inputs.target }}-${{ inputs.platform }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  job:
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_VERSION: "2.8.0"
      # Maestro's default iOS driver startup window is too short on a cold
      # public macOS runner. Its own CI raises this through the same variable.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      SYANAC_NATIVE_ACCEPTANCE: "1"

    steps:
      - name: Fetch
        env:
          TKN: ${{ secrets.SOURCE_PAT }}
          REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          git clone --depth 1 "https://x-access-token:${TKN}@github.com/${REPO}.git" src
          echo "source_sha=$(git -C src rev-parse HEAD)"

      - name: Install JavaScript dependencies
        working-directory: src/${{ inputs.target }}
        run: npm ci

      - name: Resolve native identity
        working-directory: src/${{ inputs.target }}
        run: |
          if [ "${{ inputs.platform }}" = "ios" ]; then
            APP_ID="$(npx expo config --json | jq -r '.ios.bundleIdentifier')"
          else
            APP_ID="$(npx expo config --json | jq -r '.android.package')"
          fi
          test -n "$APP_ID"
          test "$APP_ID" != "null"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "app_id=$APP_ID"

      - name: Install Maestro
        run: |
          java -version
          curl -Ls "https://get.maestro.mobile.dev" | bash
          "$HOME/.maestro/bin/maestro" --version

      - name: Install iOS signing identity
        if: ${{ inputs.platform == 'ios' }}
        working-directory: src/${{ inputs.target }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          EXPO_OWNER="$(npx expo config --json | jq -r '.owner')"
          test -n "$EXPO_OWNER"
          test "$EXPO_OWNER" != "null"
          export EXPO_OWNER
          node <<'NODE'
          const { writeFileSync } = require('node:fs');
          const { join } = require('node:path');

          async function main() {
            const variable = String.fromCharCode(36);
            const query = `query(${variable}accountName: String!) {
              account {
                byName(accountName: ${variable}accountName) {
                  appleDistributionCertificatesPaginated(first: 20) {
                    edges {
                      node {
                        certificateP12
                        certificatePassword
                        serialNumber
                        validityNotAfter
                        appleTeam { appleTeamIdentifier }
                      }
                    }
                  }
                }
              }
            }`;
            const response = await fetch('https://api.expo.dev/graphql', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.EXPO_TOKEN}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query, variables: { accountName: process.env.EXPO_OWNER } }),
            });
            const payload = await response.json();
            if (!response.ok || payload.errors) {
              throw new Error('Expo credentials query failed without returning a usable signing identity.');
            }
            const certificates = payload.data.account.byName
              .appleDistributionCertificatesPaginated.edges
              .map((edge) => edge.node)
              .filter((certificate) =>
                certificate.certificateP12 &&
                typeof certificate.certificatePassword === 'string' &&
                certificate.appleTeam?.appleTeamIdentifier &&
                Date.parse(certificate.validityNotAfter) > Date.now()
              )
              .sort((left, right) => Date.parse(right.validityNotAfter) - Date.parse(left.validityNotAfter));
            if (!certificates.length) throw new Error('No valid Expo-managed Apple distribution identity exists.');
            const certificate = certificates[0];
            const root = process.env.RUNNER_TEMP;
            writeFileSync(join(root, 'native-distribution.p12'), Buffer.from(certificate.certificateP12, 'base64'), { mode: 0o600 });
            writeFileSync(join(root, 'native-distribution.password'), certificate.certificatePassword, { mode: 0o600 });
            writeFileSync(join(root, 'native-apple-team.txt'), certificate.appleTeam.appleTeamIdentifier, { mode: 0o600 });
            writeFileSync(join(root, 'native-certificate-serial.txt'), certificate.serialNumber, { mode: 0o600 });
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          CERTIFICATE_PASSWORD="$(cat "$RUNNER_TEMP/native-distribution.password")"
          APPLE_TEAM_ID="$(cat "$RUNNER_TEMP/native-apple-team.txt")"
          CERTIFICATE_SERIAL="$(cat "$RUNNER_TEMP/native-certificate-serial.txt")"
          echo "::add-mask::$CERTIFICATE_PASSWORD"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/native-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/native-distribution.p12" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$SIGNING_KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security default-keychain -d user -s "$SIGNING_KEYCHAIN"
          IOS_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" | awk 'NR == 1 { print $2 }')"
          test -n "$IOS_SIGNING_IDENTITY"
          test "$IOS_SIGNING_IDENTITY" != "0"
          cp /usr/bin/true "$RUNNER_TEMP/native-signing-smoke"
          codesign \
            --force \
            --sign "$IOS_SIGNING_IDENTITY" \
            --timestamp=none \
            "$RUNNER_TEMP/native-signing-smoke"
          codesign --verify --strict "$RUNNER_TEMP/native-signing-smoke"
          echo "IOS_SIGNING_IDENTITY=$IOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_KEYCHAIN=$SIGNING_KEYCHAIN" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_KEYCHAIN_PASSWORD=$SIGNING_KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "ios_signing_team=$APPLE_TEAM_ID"
          echo "ios_signing_certificate_serial=$CERTIFICATE_SERIAL"
          rm -f \
            "$RUNNER_TEMP/native-distribution.p12" \
            "$RUNNER_TEMP/native-distribution.password" \
            "$RUNNER_TEMP/native-apple-team.txt" \
            "$RUNNER_TEMP/native-certificate-serial.txt"

      - name: Build iOS simulator app
        if: ${{ inputs.platform == 'ios' }}
        working-directory: src/${{ inputs.target }}
        run: |
          npx expo prebuild --platform ios --no-install --clean
          pod install --project-directory=ios
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$WORKSPACE"
          test -n "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | jq -r '.project.schemes | first')"
          test -n "$SCHEME"
          test "$SCHEME" != "null"
          SIMULATOR_ARCH="$(uname -m)"
          case "$SIMULATOR_ARCH" in
            arm64|x86_64) ;;
            *) echo "Unsupported iOS simulator host architecture: $SIMULATOR_ARCH" >&2; exit 1 ;;
          esac
          echo "ios_project=$PROJECT"
          echo "ios_scheme=$SCHEME"
          echo "ios_simulator_arch=$SIMULATOR_ARCH"
          XCODEBUILD_LOG="$RUNNER_TEMP/native-xcodebuild.log"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ARCHS="$SIMULATOR_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            > "$XCODEBUILD_LOG" 2>&1
          XCODEBUILD_STATUS=$?
          set -e
          if [ "$XCODEBUILD_STATUS" -ne 0 ]; then
            tail -800 "$XCODEBUILD_LOG"
            exit "$XCODEBUILD_STATUS"
          fi
          grep -E 'warning:|error:|BUILD SUCCEEDED' "$XCODEBUILD_LOG" | tail -200 || true
          tail -20 "$XCODEBUILD_LOG"
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          IOS_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$IOS_EXECUTABLE"
          # Let Xcode create the simulator's "Sign to Run Locally" graph. Xcode
          # owns the simulator-specific signature format; manually applying a
          # distribution identity leaves restricted entitlements unauthorized
          # and taskgated kills the app before any app code executes.
          codesign --verify --deep --strict "$APP"
          SIGNING_INFO="$(codesign --display --verbose=4 "$APP" 2>&1)"
          echo "$SIGNING_INFO"
          echo "$SIGNING_INFO" | grep -F "Identifier=$APP_ID"
          echo "$SIGNING_INFO" | grep -F "Signature=adhoc"
          echo "=== simulator signed entitlements ==="
          codesign -d --entitlements - --xml "$APP" 2>&1
          echo "IOS_APP=$APP" >> "$GITHUB_ENV"
          echo "IOS_EXECUTABLE=$IOS_EXECUTABLE" >> "$GITHUB_ENV"
          echo "simulator_app_tree_sha256=$(find "$APP" -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | awk '{print $1}')"
          echo "ios_executable=$IOS_EXECUTABLE"

      - name: Boot iOS phone and seed Photos
        if: ${{ inputs.platform == 'ios' }}
        working-directory: src/${{ inputs.target }}
        run: |
          RUNTIME="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          PHONE_TYPE="$(xcrun simctl list devicetypes --json | jq -r '([.devicetypes[] | select(.name == "iPhone 16 Pro")] | first | .identifier) // ([.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier)')"
          test -n "$RUNTIME"
          test -n "$PHONE_TYPE"
          PHONE_UDID="$(xcrun simctl create "${{ inputs.target }}-native-phone" "$PHONE_TYPE" "$RUNTIME")"
          xcrun simctl boot "$PHONE_UDID"
          xcrun simctl bootstatus "$PHONE_UDID" -b
          xcrun simctl install "$PHONE_UDID" "$IOS_APP"
          set +e
          PREFLIGHT_OUTPUT="$(xcrun simctl launch "$PHONE_UDID" "$APP_ID" 2>&1)"
          PREFLIGHT_STATUS=$?
          set -e
          echo "$PREFLIGHT_OUTPUT"
          if [ "$PREFLIGHT_STATUS" -ne 0 ]; then
            echo "iOS simulator rejected the installed Release app before Maestro"
            echo "=== iOS launch-service diagnostics ==="
            xcrun simctl spawn "$PHONE_UDID" log show \
              --last 5m \
              --style compact \
              --predicate "(process == 'SpringBoard' OR process == 'runningboardd' OR process == 'launchd_sim' OR process == 'securityd') AND (eventMessage CONTAINS[c] '$APP_ID' OR eventMessage CONTAINS[c] '$IOS_EXECUTABLE' OR eventMessage CONTAINS[c] 'signature' OR eventMessage CONTAINS[c] 'entitlement' OR eventMessage CONTAINS[c] 'validation')" \
              | tail -1200 || true
            echo "=== iOS app and code-signing diagnostics ==="
            xcrun simctl spawn "$PHONE_UDID" log show \
              --last 5m \
              --style compact \
              --predicate "process == '$IOS_EXECUTABLE' OR process == 'ReportCrash' OR process == 'amfid' OR process == 'kernel'" \
              | tail -800 || true
            echo "=== iOS app crash reports ==="
            find "$HOME/Library/Logs/DiagnosticReports" \
              -type f \
              -name "$IOS_EXECUTABLE*" \
              -mmin -10 \
              -print \
              -exec tail -800 {} \; 2>/dev/null || true
            exit "$PREFLIGHT_STATUS"
          fi
          echo "ios_preflight_launch=PASS"
          xcrun simctl terminate "$PHONE_UDID" "$APP_ID"
          FIXTURE="${{ inputs.fixture }}"
          if [ -n "$FIXTURE" ]; then
            test -f "$FIXTURE"
            xcrun simctl addmedia "$PHONE_UDID" "$FIXTURE"
          fi
          echo "DEVICE_ID=$PHONE_UDID" >> "$GITHUB_ENV"
          echo "ios_runtime=$RUNTIME"
          echo "ios_phone_type=$PHONE_TYPE"

      - name: Build Android release APK
        if: ${{ inputs.platform == 'android' }}
        working-directory: src/${{ inputs.target }}
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2
          APK="$PWD/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "ANDROID_APK=$APK" >> "$GITHUB_ENV"
          echo "release_apk_sha256=$(sha256sum "$APK" | awk '{print $1}')"

      - name: Boot Android phone and seed Photos and Files
        if: ${{ inputs.platform == 'android' }}
        working-directory: src/${{ inputs.target }}
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Keep avdmanager and emulator on one explicit ephemeral home. Public
          # runners may export Android home variables that make the creator
          # write the AVD somewhere the emulator does not search.
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$SDK_ROOT/platform-tools:$SDK_ROOT/emulator:$PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 -print | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager -perm -111 -print | sort | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          echo "android_sdk_root=$SDK_ROOT"
          echo "android_avd_home=$ANDROID_AVD_HOME"
          echo "sdkmanager=$SDKMANAGER"
          echo "avdmanager=$AVDMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;google_apis;x86_64"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/emulator/emulator"
          echo no | "$AVDMANAGER" create avd --force --name native-acceptance --package "system-images;android-34;google_apis;x86_64" --device "pixel_6" --path "$ANDROID_AVD_HOME/native-acceptance.avd"
          test -f "$ANDROID_AVD_HOME/native-acceptance.ini"
          test -d "$ANDROID_AVD_HOME/native-acceptance.avd"
          "$SDK_ROOT/emulator/emulator" -list-avds
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true
          "$SDK_ROOT/emulator/emulator" -accel-check || true
          nohup "$SDK_ROOT/emulator/emulator" \
            -avd native-acceptance \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -camera-front emulated \
            -camera-back emulated \
            -gpu swiftshader \
            -accel on \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          ADB_READY=0
          for _ in $(seq 1 90); do
            if [ "$(adb get-state 2>/dev/null || true)" = "device" ]; then
              ADB_READY=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator process exited before ADB became ready"
              tail -200 "$RUNNER_TEMP/android-emulator.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ADB_READY" != "1" ]; then
            echo "Android emulator did not become ADB-ready within 180 seconds"
            tail -200 "$RUNNER_TEMP/android-emulator.log"
            exit 1
          fi
          READY=0
          for _ in $(seq 1 150); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            tail -200 "$RUNNER_TEMP/android-emulator.log"
            exit 1
          fi
          adb shell input keyevent 82
          adb install -r "$ANDROID_APK"
          ANDROID_COMPONENT="$(
            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              -p "$APP_ID" \
              | tr -d '\r' \
              | tail -1
          )"
          test -n "$ANDROID_COMPONENT"
          case "$ANDROID_COMPONENT" in
            *"No activity found"*) echo "$ANDROID_COMPONENT" >&2; exit 1 ;;
          esac
          adb logcat -c
          set +e
          ANDROID_PREFLIGHT_OUTPUT="$(adb shell am start -W -n "$ANDROID_COMPONENT" 2>&1)"
          ANDROID_PREFLIGHT_STATUS=$?
          set -e
          echo "$ANDROID_PREFLIGHT_OUTPUT"
          sleep 10
          ANDROID_PREFLIGHT_PID="$(adb shell pidof "$APP_ID" 2>/dev/null | tr -d '\r' || true)"
          if [ "$ANDROID_PREFLIGHT_STATUS" -ne 0 ] || [ -z "$ANDROID_PREFLIGHT_PID" ]; then
            echo "Android Release app failed direct launch before Maestro"
            echo "=== Android activity state ==="
            adb shell dumpsys activity activities | tail -500 || true
            echo "=== Android direct-launch log ==="
            adb logcat -d -v threadtime -t 3000 | tail -1600 || true
            exit 1
          fi
          echo "android_preflight_component=$ANDROID_COMPONENT"
          echo "android_preflight_pid=$ANDROID_PREFLIGHT_PID"
          echo "android_preflight_launch=PASS"
          adb shell am force-stop "$APP_ID"
          adb shell pm clear "$APP_ID"
          # Keep the freshly reset app transition away from the resource-heavy
          # launcher. A cold public runner can ANR Pixel Launcher while Maestro
          # is attaching accessibility, which blocks the app start and falsely
          # reports a missing first screen even though the Release app survived
          # the direct-launch probe above.
          HOME_COMPONENT="$(
            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.HOME \
              | tr -d '\r' \
              | tail -1
          )"
          HOME_PACKAGE="${HOME_COMPONENT%%/*}"
          if [ -n "$HOME_PACKAGE" ] && [ "$HOME_PACKAGE" != "$HOME_COMPONENT" ]; then
            adb shell am force-stop "$HOME_PACKAGE" || true
          fi
          adb shell am start -W -a android.settings.SETTINGS >/dev/null
          sleep 3
          echo "android_neutral_foreground=PASS"
          adb logcat -c
          FIXTURE="${{ inputs.fixture }}"
          if [ -n "$FIXTURE" ]; then
            test -f "$FIXTURE"
            adb shell mkdir -p /sdcard/Pictures /sdcard/Download
            adb push "$FIXTURE" /sdcard/Pictures/native-acceptance-source.png
            adb push "$FIXTURE" /sdcard/Download/native-acceptance-source.png
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Pictures/native-acceptance-source.png
          fi
          echo "DEVICE_ID=$(adb get-serialno)" >> "$GITHUB_ENV"
          echo "android_api=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "android_model=$(adb shell getprop ro.product.model | tr -d '\r')"

      - name: Run native phone flow
        working-directory: src/${{ inputs.target }}
        run: |
          FLOW=".maestro/gate-a-${{ inputs.platform }}.yaml"
          test -f "$FLOW"
          MEMORY_LOG="$RUNNER_TEMP/native-memory-kib.txt"
          MEMORY_TRACE="$RUNNER_TEMP/native-memory-trace.tsv"
          : > "$MEMORY_LOG"
          : > "$MEMORY_TRACE"
          sample_memory() {
            while true; do
              SAMPLE_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if [ "${{ inputs.platform }}" = "ios" ]; then
                ps -A -o pid=,rss=,command= 2>/dev/null \
                  | awk -v executable="$IOS_EXECUTABLE" -v memory_log="$MEMORY_LOG" -v memory_trace="$MEMORY_TRACE" -v sample_time="$SAMPLE_TIME" '
                      {
                        pid = $1
                        rss = $2
                        $1 = ""
                        $2 = ""
                        sub(/^[[:space:]]+/, "", $0)
                        if ($0 == executable || index($0, "/" executable) > 0) {
                          print rss >> memory_log
                          print sample_time "\t" pid "\t" rss "\t" $0 >> memory_trace
                          fflush()
                        }
                      }
                    ' || true
              else
                ANDROID_PSS="$(
                  adb shell dumpsys meminfo "$APP_ID" 2>/dev/null \
                    | sed -n 's/.*TOTAL PSS:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
                    | tail -1
                )"
                if [ -n "$ANDROID_PSS" ]; then
                  echo "$ANDROID_PSS" >> "$MEMORY_LOG"
                  printf '%s\t%s\t%s\t%s\n' "$SAMPLE_TIME" "$(adb shell pidof "$APP_ID" 2>/dev/null | tr -d '\r')" "$ANDROID_PSS" "$APP_ID" >> "$MEMORY_TRACE"
                fi
              fi
              sleep 0.5
            done
          }
          sample_memory &
          SAMPLER_PID=$!
          stop_sampler() {
            kill "$SAMPLER_PID" 2>/dev/null || true
            wait "$SAMPLER_PID" 2>/dev/null || true
          }
          trap stop_sampler EXIT
          set +e
          "$HOME/.maestro/bin/maestro" --device="$DEVICE_ID" test "$FLOW"
          FLOW_STATUS=$?
          set -e
          stop_sampler
          trap - EXIT
          PEAK_KIB="$(awk 'NF && ($1 + 0) > max { max = $1 + 0 } END { print max + 0 }' "$MEMORY_LOG")"
          SAMPLE_COUNT="$(awk 'NF { count++ } END { print count + 0 }' "$MEMORY_LOG")"
          FINAL_KIB="$(awk 'NF { value = $1 + 0 } END { print value + 0 }' "$MEMORY_LOG")"
          P95_KIB="$(sort -n "$MEMORY_LOG" | awk 'NF { values[++count] = $1 + 0 } END { if (!count) print 0; else print values[int((count * 95 + 99) / 100)] }')"
          echo "native_memory_sample_count=$SAMPLE_COUNT"
          echo "native_peak_process_memory_kib=$PEAK_KIB"
          echo "native_p95_process_memory_kib=$P95_KIB"
          echo "native_final_process_memory_kib=$FINAL_KIB"
          echo "=== top native process-memory samples ==="
          sort -t $'\t' -k3,3nr "$MEMORY_TRACE" | head -10 || true
          if [ "$FLOW_STATUS" -ne 0 ]; then
            echo "=== native failure hierarchy ==="
            "$HOME/.maestro/bin/maestro" --device="$DEVICE_ID" hierarchy || true
            if [ "${{ inputs.platform }}" = "ios" ]; then
              echo "=== iOS app process ==="
              ps -A -o pid=,rss=,command= \
                | grep "$IOS_EXECUTABLE" || true
              echo "=== iOS app log (last 15 minutes) ==="
              xcrun simctl spawn "$DEVICE_ID" log show \
                --last 15m \
                --style compact \
                --predicate "process == '$IOS_EXECUTABLE'" \
                | tail -500 || true
            else
              echo "=== Android final accessibility tree ==="
              adb shell uiautomator dump /sdcard/native-failure.xml >/dev/null || true
              adb shell cat /sdcard/native-failure.xml | head -c 20000 || true
              echo
              echo "=== Android app log ==="
              adb logcat -d -v threadtime -t 3000 | tail -1600 || true
            fi
            exit "$FLOW_STATUS"
          fi
          test "$SAMPLE_COUNT" -gt 0
          test "$PEAK_KIB" -gt 0
          test "$PEAK_KIB" -lt 184320
          echo "native_phone_flow=PASS"

      - name: Run app-specific native postchecks
        working-directory: src/${{ inputs.target }}
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          POST="scripts/native-acceptance-post-${{ inputs.platform }}.sh"
          if [ -f "$POST" ]; then
            bash "$POST"
          else
            echo "No app-specific postcheck at $POST"
          fi

      - name: Capture native runtime evidence
        working-directory: src/${{ inputs.target }}
        run: |
          if [ "${{ inputs.platform }}" = "ios" ]; then
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/native-final.png"
            echo "final_screenshot_sha256=$(shasum -a 256 "$RUNNER_TEMP/native-final.png" | awk '{print $1}')"
            sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/native-final.png"
            echo "=== iOS process memory (KiB RSS) ==="
            xcrun simctl spawn "$DEVICE_ID" ps -A -o pid=,rss=,command= | grep "$APP_ID" || true
          else
            adb exec-out screencap -p > "$RUNNER_TEMP/native-final.png"
            echo "final_screenshot_sha256=$(sha256sum "$RUNNER_TEMP/native-final.png" | awk '{print $1}')"
            file "$RUNNER_TEMP/native-final.png"
            echo "=== Android process memory ==="
            adb shell dumpsys meminfo "$APP_ID" | sed -n '/App Summary/,/Objects/p'
            echo "=== Android final accessibility tree ==="
            adb shell uiautomator dump /sdcard/native-final.xml >/dev/null
            adb shell cat /sdcard/native-final.xml | head -c 12000
            echo
          fi

      - name: Run optional iOS tablet flow
        if: ${{ inputs.platform == 'ios' }}
        working-directory: src/${{ inputs.target }}
        run: |
          FLOW=".maestro/gate-a-ios-tablet.yaml"
          if [ ! -f "$FLOW" ]; then
            echo "No optional tablet flow at $FLOW"
            exit 0
          fi
          RUNTIME="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          TABLET_TYPE="$(xcrun simctl list devicetypes --json | jq -r '([.devicetypes[] | select(.name == "iPad Pro 11-inch (M4)")] | first | .identifier) // ([.devicetypes[] | select(.name | startswith("iPad"))] | last | .identifier)')"
          test -n "$TABLET_TYPE"
          TABLET_UDID="$(xcrun simctl create "${{ inputs.target }}-native-tablet" "$TABLET_TYPE" "$RUNTIME")"
          xcrun simctl boot "$TABLET_UDID"
          xcrun simctl bootstatus "$TABLET_UDID" -b
          xcrun simctl install "$TABLET_UDID" "$IOS_APP"
          "$HOME/.maestro/bin/maestro" --device="$TABLET_UDID" test "$FLOW"
          xcrun simctl io "$TABLET_UDID" screenshot "$RUNNER_TEMP/native-tablet-final.png"
          echo "native_tablet_flow=PASS"
          echo "tablet_screenshot_sha256=$(shasum -a 256 "$RUNNER_TEMP/native-tablet-final.png" | awk '{print $1}')"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/native-tablet-final.png"

      # The runner is ephemeral. Deliberately no artifact upload: binaries and
      # private source never leave this job; the provider-verifiable run log is
      # the retained evidence surface.
